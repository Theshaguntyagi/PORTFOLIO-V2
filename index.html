<!doctype html>

<meta charset="UTF-8" />

<!-- GitHub Pages SPA redirect decoder (pairs with public/404.html).
     Restores the clean URL that 404.html encoded into ?/… before the app boots. -->
<script type="text/javascript">
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&');
      }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Security Headers (CSP Client-Side Protection).
     'unsafe-eval' removed — grepped the full source tree and all bundled
     node_modules (three.js, postprocessing, syntax-highlighter, etc.) for
     eval()/new Function() and found none. Vite's production output doesn't
     need it either. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self';" />

<!-- Preconnect: warms the connection to the third-party origins the app
     actually calls (Firestore on every page, GA/GTM + Cloudflare beacon after
     consent/idle) so those requests don't pay full DNS+TLS handshake cost
     the first time they fire. -->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.googletagmanager.com" />
<link rel="preconnect" href="https://static.cloudflareinsights.com" />

<!-- ProfilePage wrapping Person — this is the ONLY Person/ProfilePage schema
     on the site. SEO.jsx used to inject a second, competing Person block on
     "/" via Helmet; that was removed there specifically to avoid duplicate
     schema on the homepage. Using ProfilePage (not bare Person) is the
     Schema.org-correct type for a page whose main entity is a person's own
     profile/portfolio site, per Google's profile page guidance. -->
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "ProfilePage",
 "dateCreated": "2024-01-01",
 "mainEntity": {
   "@type": "Person",
   "name": "Shagun Tyagi",
   "url": "https://shaguntyagi.tech",
   "image": "https://shaguntyagi.tech/profile.webp",
   "jobTitle": "AI/ML Engineer",
   "worksFor": {

     "name": "Envigo"
   },
   "alumniOf": {
     "@type": "CollegeOrUniversity",
     "name": "Meerut Institute of Engineering and Technology"
   },
   "sameAs": [
     "https://github.com/theshaguntyagi",
     "https://linkedin.com/in/theshaguntyagi"
   ],
   "knowsAbout": [
     "Machine Learning",
     "Python",
     "Full Stack Development",
     "Cloud Computing",
     "IoT"
   ]
 }
}
</script>

<!-- WebSite Schema.

     ship a fake affordance. Re-add it if/when a real site search ships. -->

{
 "@context": "https://schema.org",
 "@type": "WebSite",
 "name": "Shagun Tyagi Portfolio",
 "url": "https://shaguntyagi.tech"
}
</script>
