# Builds the site and publishes dist/ to the gh-pages branch (shaguntyagi.tech).
#
# Triggers:
#   - push to main         → always rebuild (code changed)
#   - every 15 min         → rebuild ONLY if published blog content differs
#                            from what's live (Firestore vs /content-hash.txt):
#                            publish / edit / unpublish in /admin → live in ≤30 min
#   - daily 02:00 IST      → forced rebuild (backstop)
#   - workflow_dispatch    → manual "Run workflow" button (forced rebuild)
#
# Repo secret (Settings → Secrets and variables → Actions):
#   DOTENV — full contents of your local .env (VITE_* keys).
name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "functions/**"
      - "firestore.rules"
      - "**/*.md"
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 20 * * *" # 02:00 IST forced rebuild
  workflow_dispatch:

permissions:
  contents: write

# Queue, never cancel, so a running deploy always finishes.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write .env
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::error::Repo secret DOTENV is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s\n' "$DOTENV" > .env
          grep -q '^VITE_FIREBASE_PROJECT_ID=' .env || { echo "::error::DOTENV has no VITE_FIREBASE_PROJECT_ID"; exit 1; }

      # Dependency-free: runs before npm ci so a no-change check costs ~10s.
      - name: Fingerprint published content
        id: sync
        run: node scripts/site-sync.mjs

      - name: Decide whether to rebuild
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          HASH: ${{ steps.sync.outputs.hash }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$CRON" = "30 20 * * *" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Forced build ($EVENT)"; exit 0
          fi
          LIVE=$(curl -fsS --max-time 20 "https://shaguntyagi.tech/content-hash.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
          if [ "$LIVE" = "$HASH" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "No content change — skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Content changed (live=${LIVE:-none} new=$HASH) — rebuilding."
          fi

      - name: Install
        if: steps.decide.outputs.build == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build
        if: steps.decide.outputs.build == 'true'
        env:
          # Fail instead of deploying a site with blog pages missing if Firestore is down.
          STRICT_BLOGS: "1"
        run: npm run build

      - name: Sanity-check output
        if: steps.decide.outputs.build == 'true'
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/sitemap.xml
          test -s dist/content-hash.txt
          grep -q '<loc>https://shaguntyagi.tech/blog/' dist/sitemap.xml \
            || echo "::warning::sitemap has no blog post URLs (no published posts?)"

      - name: Deploy to gh-pages
        if: steps.decide.outputs.build == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event_name }} ${{ github.sha }}"
